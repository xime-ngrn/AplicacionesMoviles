name: misteriogranja
description: "Misterio en la Granja: aventura de detectives con partidas en TXT, XML y JSON."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Rutas y carpeta privada de la app (donde se guardan las partidas).
  path_provider: ^2.1.6
  path: ^1.9.1
  # Opciones del jugador (tema, formato preferido, dificultad, sonido...).
  shared_preferences: ^2.5.6
  # Lectura y escritura de partidas en XML (7.0.x: flutter_svg aún no admite 7.1).
  xml: ^7.0.1
  # Importar partidas desde el dispositivo y exportarlas a donde elija el usuario.
  file_picker: ^13.3.2
  # Compartir partidas con otras apps.
  share_plus: ^13.3.1
  # Efectos de sonido (archivos incluidos en la app, sin conexión).
  audioplayers: ^6.8.1
  # Ilustraciones de animales y lugares en SVG.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/
